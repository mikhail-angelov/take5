<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acceptance App — second page</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0e1116;
        color: #e6edf3;
      }
      main { max-width: 860px; margin: 0 auto; padding: 48px 28px; }
      h1 { font-size: 20px; }
      p { color: #8b949e; }
      .actions { display: flex; gap: 12px; margin-top: 28px; }
      button {
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: #2f81f7;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #161b22; border-color: #262d36; color: #e6edf3; }
      a { color: #2f81f7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Second page</h1>
      <p>
        Reached by a normal in-tab navigation. Recording must continue here, with events
        still timestamped against the original session clock (spec 6.4).
      </p>
      <div class="actions">
        <button id="save">Save</button>
        <button class="secondary" id="publish">Publish</button>
      </div>
      <p style="margin-top: 32px"><a href="/app.html">Back to the first page</a></p>
    </main>
    <script>
      for (const id of ["save", "publish"]) {
        document.getElementById(id).addEventListener("click", (e) => {
          e.target.textContent = `${e.target.textContent.replace(/ ✓$/, "")} ✓`;
        });
      }
    </script>
  </body>
</html>
