<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Take5</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font: 14px/1.45 system-ui, sans-serif;
        background: linear-gradient(180deg, #f8fafc, #e2e8f0);
        color: #0f172a;
      }

      main {
        width: 320px;
        padding: 16px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 10px;
      }

      .hint {
        padding: 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Take5</h1>
      <p>The recorder toolbar appears inside normal web pages.</p>
      <div class="hint">
        <p>Open an <code>http://</code> or <code>https://</code> page and look in the bottom-right corner.</p>
        <p>Chrome internal pages like <code>chrome://extensions</code> do not support the injected toolbar.</p>
      </div>
    </main>
  </body>
</html>
