name: release

# Pushing a `v*` tag produces a GitHub Release: cross-compiled binaries plus the extension
# zip, both assembled by .goreleaser.yaml.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # goreleaser publishes the GitHub Release and uploads its assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser's changelog needs full history, not the tag commit alone

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"   # keep in sync with go.mod

      # The extension zip that release.extra_files attaches is built by .goreleaser.yaml's own
      # before hook, not a step here — `release --clean` would delete anything this job wrote
      # to dist/ beforehand.
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
