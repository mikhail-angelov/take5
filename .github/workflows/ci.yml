name: build

# Tag pushes deliberately do not run this: a `v*` tag points at a commit whose master push
# was already checked here, and the tag triggers release.yml instead.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read   # least privilege by default

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0              # golangci-lint --new-from-rev needs history to diff against
          persist-credentials: false  # don't leave a usable token in the workspace

      - name: set up go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"          # keep in sync with go.mod

      - name: build and test
        run: |
          go build ./...
          go test -v -race -timeout=120s -covermode=atomic ./...

      - name: golangci-lint (new code only)
        uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.12.2"          # pinned so lint results are reproducible
          args: --new-from-rev=origin/main
